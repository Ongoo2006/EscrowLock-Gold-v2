name: Build Gold APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Expo
        run: npm install -g eas-cli expo-cli
      - name: Install Deps
        run: npm install
      - name: Build Web
        run: npx expo export:web
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: escrowlock-gold-website
          path: web-build
